                                                                        <div class="bg-verein-pink h-2 rounded-full" style="width:${anteil}%"></div>
                                                                    </div>
                                                                    <span class="text-gray-500">${anteil}%</span>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                        ${isExp ? `<tr><td colspan="7" class="px-0 py-0">
                                                            <div class="bg-gray-50 px-8 py-4">
                                                                <p class="text-xs font-semibold text-gray-500 uppercase mb-3">Einzelne Auslagen</p>
                                                                <div class="space-y-2">${d.auslagen.map(a => `
                                                                    <div class="bg-white rounded-lg p-3 border border-gray-200">
                                                                        <div class="flex justify-between items-start">
                                                                            <div class="flex-1">
                                                                                <p class="font-medium text-gray-800 text-sm">${a.zweck}</p>
                                                                                <div class="flex gap-3 mt-1 text-xs text-gray-500">
                                                                                    <span>📅 ${a.datum}</span>
                                                                                    <span>👤 ${a.mitglied}</span>
                                                                                    <span class="px-2 py-0.5 rounded-full ${a.status === 'offen' ? 'bg-verein-cyan-light text-verein-cyan' : 'bg-green-100 text-green-700'}">${a.status === 'offen' ? '⏳ Offen' : '✅ Bezahlt'}</span>
                                                                                </div>
                                                                            </div>
                                                                            <p class="text-lg font-bold text-verein-pink ml-4">${a.betrag.toFixed(2)} €</p>
                                                                        </div>
                                                                    </div>`).join('')}
                                                                </div>
                                                            </div>
                                                        </td></tr>` : ''}`;
                                                }).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>` : `
                                <div class="text-center py-12">
                                    <p class="text-gray-400 text-lg">📊</p>
                                    <p class="text-gray-500 mt-2">Keine Daten für diesen Zeitraum</p>
                                </div>`}
                        </div>
                        <div class="sticky bottom-0 bg-white border-t border-gray-200 p-6 rounded-b-2xl flex gap-3">
                            <button onclick="closeReportModal()" class="flex-1 py-3 rounded-lg border-2 border-gray-300 text-gray-600 font-semibold hover:bg-gray-50 transition">Schließen</button>
                            <button onclick="exportReport()" class="flex-1 py-3 rounded-lg bg-green-500 hover:bg-green-600 text-white font-semibold transition ${!state.reportModal.data || state.reportModal.data.length === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${!state.reportModal.data || state.reportModal.data.length === 0 ? 'disabled' : ''}>📥 Als CSV exportieren</button>
                        </div>
                    </div>
                </div>`;
        }

        // --- Render: Kategorien Modal ---
        function renderKategorienModal() {
            if (!state.kategorienModal.open) return '';
            return `
                <div class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4" onclick="closeKategorienModal()">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-screen overflow-y-auto" onclick="event.stopPropagation()">
                        <div class="bg-verein-darkblue text-white p-6 rounded-t-2xl flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-bold">Kategorien verwalten</h2>
                                <p class="text-cyan-200 text-sm mt-1">${state.kategorien.length} Kategorien</p>
                            </div>
                            <button onclick="closeKategorienModal()" class="text-white hover:text-cyan-200 text-2xl font-bold">✕</button>
                        </div>
                        <div class="p-6">
                            <div class="mb-6">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Neue Kategorie hinzufügen</label>
                                <div class="flex gap-2">
                                    <input type="text" id="neue-kategorie-input" placeholder="z.B. Dekoration"
                                        value="${state.kategorienModal.neueKategorie}"
                                        oninput="state.kategorienModal.neueKategorie = this.value"
                                        onkeypress="if(event.key === 'Enter') addKategorie()"
                                        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:border-verein-pink focus:outline-none" />
                                    <button onclick="addKategorie()" class="px-4 py-2 bg-verein-pink hover:bg-verein-pink-dark text-white rounded-lg font-semibold transition">+ Hinzufügen</button>
                                </div>
                            </div>
                            <div class="border-t pt-4">
                                <h3 class="text-sm font-semibold text-gray-700 mb-3">Bestehende Kategorien</h3>
                                <div class="space-y-2 max-h-96 overflow-y-auto">
                                    ${state.kategorien.map(kat => {
                                        const inUse = state.auslagen.some(a => a.kategorie === kat);
                                        return `<div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                                            <span class="font-medium text-gray-700">${kat}</span>
                                            <div class="flex items-center gap-2">
                                                ${inUse ? '<span class="text-xs text-gray-400 bg-white px-2 py-1 rounded">in Benutzung</span>' : ''}
                                                <button onclick="deleteKategorie('${kat.replace(/'/g, "\\'")}')"
                                                    class="px-3 py-1 ${inUse ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-red-100 text-red-600 hover:bg-red-200'} text-xs rounded transition"
                                                    ${inUse ? 'disabled' : ''}>🗑️ Löschen</button>
                                            </div>
                                        </div>`;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="sticky bottom-0 bg-white border-t border-gray-200 p-6 rounded-b-2xl">
                            <button onclick="closeKategorienModal()" class="w-full py-3 rounded-lg border-2 border-gray-300 text-gray-600 font-semibold hover:bg-gray-50 transition">Fertig</button>
                        </div>
                    </div>
                </div>`;
        }

        // --- Render: Lade-Overlay ---
        function renderLoading() {
            if (!state.loading) return '';
            return `
                <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div class="bg-white rounded-2xl shadow-2xl px-12 py-10 flex flex-col items-center gap-6">
                        <div class="flex items-center gap-1">
                            <span class="dot dot-1"></span>
                            <span class="dot dot-2"></span>
                            <span class="dot dot-3"></span>
                        </div>
                        <p class="text-gray-700 font-semibold text-lg">Wird hochgeladen…</p>
                        <p class="text-gray-400 text-sm">Google Drive wird kontaktiert</p>
                    </div>
                </div>`;
        }

        // --- Render: Toast ---
        function renderToast() {
            if (!state.toast) return '';
            setTimeout(() => { state.toast = null; render(); }, 4000);
            return `
                <div class="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-verein-darkblue text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3">
                    <span class="text-2xl">✓</span>
                    <p class="font-semibold">${state.toast}</p>
                    <button onclick="state.toast = null; render();" class="ml-4 bg-verein-pink hover:bg-verein-pink-dark px-3 py-1 rounded-lg text-sm font-semibold transition">OK</button>
                </div>`;
        }

        // --- Render: Auszahlungs-Modal ---
        function renderModal() {
            if (!state.modal.open) return '';
            const summeAusgewaehlt = state.modal.ausgewaehlt.reduce((sum, id) => {
                const a = state.auslagen.find(a => a.id === id);
                return sum + (a ? a.betrag : 0);
            }, 0);
            return `
                <div class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4" onclick="closeModal()">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-screen overflow-y-auto" onclick="event.stopPropagation()">
                        <div class="bg-verein-darkblue text-white p-6 rounded-t-2xl flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-bold">Belege von ${state.modal.mitglied}</h2>
                                <p class="text-cyan-200 text-sm mt-1">${state.modal.belegeDesMitglieds.length} offene Positionen</p>
                            </div>
                            <button onclick="closeModal()" class="text-white hover:text-cyan-200 text-2xl font-bold">✕</button>
                        </div>
                        <div class="p-6 space-y-4">
                            ${state.modal.belegeDesMitglieds.map(auslage => {
                                const isChecked = state.modal.ausgewaehlt.includes(auslage.id);
                                return `<div onclick="toggleBeleg(${auslage.id})"
                                    class="border-2 rounded-xl p-4 cursor-pointer transition-all ${isChecked ? 'border-verein-pink bg-verein-pink-light' : 'border-gray-200 hover:border-gray-300'}">
                                    <div class="flex items-start gap-4">
                                        <div class="mt-1">
                                            <div class="w-6 h-6 rounded border-2 flex items-center justify-center ${isChecked ? 'bg-verein-pink border-verein-pink' : 'border-gray-400'}">
                                                ${isChecked ? '<span class="text-white text-xs font-bold">✓</span>' : ''}
                                            </div>
                                        </div>
                                        <div class="flex-1">
                                            <div class="flex justify-between items-start">
                                                <div>
                                                    <p class="font-semibold text-gray-800">${auslage.zweck}</p>
                                                    <p class="text-sm text-gray-500">${auslage.kategorie} • ${auslage.datum}</p>
                                                    <span class="inline-block mt-1 px-2 py-0.5 rounded-full text-xs bg-cyan-100 text-verein-cyan">⏳ Offen</span>
                                                </div>
                                                <p class="text-xl font-bold text-verein-pink ml-4">${auslage.betrag.toFixed(2)} €</p>
                                            </div>
                                            ${(() => {
                                                const bb = getBelege(auslage.beleg);
                                                if (bb.length === 0) return '<p class="text-xs text-gray-400 mt-2">📷 Kein Beleg hochgeladen</p>';
                                                return `<div class="mt-3 flex gap-2 overflow-x-auto">${bb.map((b, i) => `<img src="${b}" alt="Beleg" onclick="viewBeleg(${auslage.id}, ${i})" class="h-28 w-28 object-cover rounded-lg border border-gray-200 cursor-pointer hover:opacity-80 flex-shrink-0" />`).join('')}</div>`;
                                            })()}
                                        </div>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                        <div class="sticky bottom-0 bg-white border-t border-gray-200 p-6 rounded-b-2xl">
                            <div class="flex justify-between items-center mb-4">
                                <p class="text-gray-600 text-sm">${state.modal.ausgewaehlt.length} von ${state.modal.belegeDesMitglieds.length} ausgewählt</p>
                                <p class="text-2xl font-bold text-verein-pink">${summeAusgewaehlt.toFixed(2)} €</p>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="closeModal()" class="flex-1 py-3 rounded-lg border-2 border-gray-300 text-gray-600 font-semibold hover:bg-gray-50 transition">Abbrechen</button>
                                <button onclick="bezahleAusgewaehlt()"
                                    class="flex-1 py-3 rounded-lg font-semibold text-white transition ${state.modal.ausgewaehlt.length === 0 ? 'bg-gray-300 cursor-not-allowed' : 'bg-verein-pink hover:bg-verein-pink-dark'}"
                                    ${state.modal.ausgewaehlt.length === 0 ? 'disabled' : ''}>
                                    💰 ${state.modal.ausgewaehlt.length} Belege bezahlen
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        // --- Render: Login ---
        function renderLogin() {
            return `
                <div class="min-h-screen bg-gradient-verein flex items-center justify-center p-4">

                            <p id="loginError" class="text-red-600 text-sm min-h-[1.25rem]"></p>

                                class="w-full bg-verein-pink text-white py-3 rounded-lg font-semibold hover:bg-verein-pink-dark transition-all">
                                Anmelden
                            </button>
                        </div>
                    </div>
                </div>`;
        }

        function renderNavigation() {
            const isMitglied = state.currentUser.rolle === 'mitglied';
            const isKassenwart = state.currentUser.rolle === 'kassenwart';
            return `

                            <div>
                                <h1 class="text-2xl font-bold">Auslagen-Verwaltung</h1>
                                <p class="text-cyan-200 text-sm">Angemeldet als: ${state.currentUser.name} (${state.currentUser.rolle === 'kassenwart' ? 'Kassenwart' : 'Mitglied'})</p>

                        </div>
                        <div class="flex flex-wrap gap-2">

                                <button onclick="state.view = 'meine-auslagen'; render();" class="px-4 py-2 rounded ${state.view === 'meine-auslagen' ? 'bg-white text-verein-pink' : 'bg-verein-pink hover:bg-verein-pink-dark'}">Meine Auslagen</button>
                                <button onclick="state.view = 'neue-auslage'; render();" class="px-4 py-2 rounded ${state.view === 'neue-auslage' ? 'bg-white text-verein-pink' : 'bg-verein-pink hover:bg-verein-pink-dark'}">+ Neue Auslage</button>

        // --- Render: Neue Auslage ---
        function renderNeueAuslage() {

                    <div class="max-w-2xl mx-auto p-6">

                                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-verein-pink focus:outline-none"
                                        rows="3" placeholder="z.B. Stoffe für Kostüme, Getränke für Festwagen...">${state.formData.zweck}</textarea>
                                </div>

                                    <label class="block text-sm font-medium text-gray-700 mb-2">Beleg hochladen</label>
                                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-4">
                                        ${state.formData.belege.length > 0 ? `
                                            <div class="grid grid-cols-3 gap-2 mb-3">

        // --- Render: Meine Auslagen ---
        function renderMeineAuslagen() {
            const meineAuslagen = state.auslagen.filter(a => a.mitglied === state.currentUser.name);
            const summeOffen = meineAuslagen.filter(a => a.status === 'offen').reduce((s, a) => s + a.betrag, 0);
            const summeBezahlt = meineAuslagen.filter(a => a.status === 'bezahlt').reduce((s, a) => s + a.betrag, 0);
            return `
                <div class="min-h-screen bg-gray-50">
                    ${renderNavigation()}
                    <div class="max-w-6xl mx-auto p-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <div class="bg-white rounded-lg shadow p-6">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-500 text-sm">Offen</p><p class="text-3xl font-bold text-verein-cyan">${summeOffen.toFixed(2)} €</p></div>
                                    <div class="text-4xl">⏳</div>
                                </div>
                            </div>
                            <div class="bg-white rounded-lg shadow p-6">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-500 text-sm">Bezahlt</p><p class="text-3xl font-bold text-green-500">${summeBezahlt.toFixed(2)} €</p></div>
                                    <div class="text-4xl">✅</div>
                                </div>
                            </div>
                            <div class="bg-white rounded-lg shadow p-6">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-500 text-sm">Gesamt</p><p class="text-3xl font-bold text-verein-pink">${meineAuslagen.length}</p></div>
                                    <div class="text-4xl">📋</div>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white rounded-lg shadow">
                            <div class="p-6">
                                <h2 class="text-xl font-bold text-gray-800 mb-4">Meine Auslagen</h2>
                                ${meineAuslagen.length === 0 ? '<p class="text-gray-500 text-center py-8">Noch keine Auslagen erfasst</p>' : `
                                    <div class="space-y-4">
                                        ${meineAuslagen.sort((a, b) => b.id - a.id).map(auslage => `
                                            <div class="border rounded-lg p-4 hover:shadow-md transition">
                                                <div class="flex flex-wrap justify-between items-start mb-2 gap-4">
                                                    <div class="flex-1 min-w-0">
                                                        <h3 class="font-semibold text-lg">${auslage.zweck}</h3>
                                                        <p class="text-sm text-gray-500">${auslage.kategorie} • ${auslage.datum}</p>
                                                    </div>
                                                    <div class="text-right">
                                                        <p class="text-2xl font-bold text-verein-pink">${auslage.betrag.toFixed(2)} €</p>
                                                        <span class="inline-block px-3 py-1 rounded-full text-sm font-medium ${auslage.status === 'offen' ? 'bg-verein-cyan-light text-verein-cyan' : 'bg-green-100 text-green-700'}">
                                                            ${auslage.status === 'offen' ? '⏳ Offen' : '✅ Bezahlt'}
                                                        </span>
                                                    </div>
                                                </div>
                                                ${(() => {
                                                    const bb = getBelege(auslage.beleg);
                                                    if (bb.length === 0) return '';
                                                    return `<div class="flex gap-2 mt-2 flex-wrap">${bb.map((b, i) => `<img src="${b}" onclick="viewBeleg(${auslage.id}, ${i})" class="w-20 h-20 object-cover rounded cursor-pointer hover:opacity-80 border border-gray-200" />`).join('')}</div>`;
                                                })()}
                                                ${auslage.status === 'offen' ? `
                                                    <div class="mt-3 flex gap-2">
                                                        <button onclick="openEditModal(${auslage.id})" class="px-3 py-1 bg-blue-100 text-blue-600 text-xs rounded hover:bg-blue-200 transition">✏️ Bearbeiten</button>
                                                        <button onclick="deleteAuslage(${auslage.id})" class="px-3 py-1 bg-red-100 text-red-600 text-xs rounded hover:bg-red-200 transition">🗑️ Löschen</button>
                                                    </div>` : ''}
                                            </div>`).join('')}
                                    </div>`}
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        // --- Render: Dashboard ---
        function renderDashboard() {
            const aktive = state.auslagen.filter(a => !a.geloescht);
            const offene = aktive.filter(a => a.status === 'offen');
            const bezahlt = aktive.filter(a => a.status === 'bezahlt');
            const summeOffen = offene.reduce((s, a) => s + a.betrag, 0);
            const summeBezahlt = bezahlt.reduce((s, a) => s + a.betrag, 0);
            const kassenAktuell = state.kassenbestand - summeBezahlt;
            const kassenNachAbzug = kassenAktuell - summeOffen;
            return `
                <div class="min-h-screen bg-gray-50">
                    ${renderNavigation()}
                    <div class="max-w-6xl mx-auto p-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <div class="bg-white rounded-lg shadow p-6 cursor-pointer hover:shadow-md hover:border-2 hover:border-verein-cyan transition-all" onclick="state.panelModal = { open: true, typ: 'offen' }; render();">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-500 text-sm">Offen</p><p class="text-2xl font-bold text-verein-cyan">${summeOffen.toFixed(2)} €</p><p class="text-gray-400 text-xs">${offene.length} Positionen</p></div>
                                    <div class="text-3xl">⏳</div>
                                </div>
                            </div>
                            <div class="bg-white rounded-lg shadow p-6 cursor-pointer hover:shadow-md hover:border-2 hover:border-green-400 transition-all" onclick="state.panelModal = { open: true, typ: 'bezahlt' }; render();">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-500 text-sm">Bezahlt</p><p class="text-2xl font-bold text-green-500">${summeBezahlt.toFixed(2)} €</p><p class="text-gray-400 text-xs">${bezahlt.length} Positionen</p></div>
                                    <div class="text-3xl">✅</div>
                                </div>
                            </div>
                            <div class="bg-white rounded-lg shadow p-6 cursor-pointer hover:shadow-md hover:border-2 hover:border-verein-pink transition-all" onclick="state.panelModal = { open: true, typ: 'gesamt' }; render();">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-500 text-sm">Gesamt</p><p class="text-2xl font-bold text-verein-pink">${aktive.length}</p><p class="text-gray-400 text-xs">Aktive Auslagen</p></div>
                                    <div class="text-3xl">📋</div>
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div class="bg-verein-darkblue rounded-lg shadow p-6">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-cyan-200 text-sm">Kassenbestand aktuell</p>
                                        <p class="text-3xl font-bold text-white">${kassenAktuell.toFixed(2)} €</p>
                                        <p class="text-cyan-300 text-xs mt-1">bereits bezahlt: ${summeBezahlt.toFixed(2)} €</p>
                                    </div>
                                    <div class="text-3xl">🏦</div>
                                </div>
                            </div>
                            <div class="rounded-lg shadow p-6 ${kassenNachAbzug < 0 ? 'bg-red-600' : 'bg-verein-pink'}">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-pink-100 text-sm">Kasse nach offenen Abzügen</p>
                                        <p class="text-3xl font-bold text-white">${kassenNachAbzug.toFixed(2)} €</p>
                                        <p class="text-pink-200 text-xs mt-1">Abzug: ${summeOffen.toFixed(2)} €</p>
                                    </div>
                                    <div class="text-3xl">${kassenNachAbzug < 0 ? '⚠️' : '✅'}</div>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white rounded-lg shadow overflow-hidden mb-6">
                            <div class="p-6">
                                <h2 class="text-xl font-bold text-gray-800 mb-4">💸 Auszahlungen je Mitglied</h2>
                                ${(() => {
                                    const nachMitglied = offene.reduce((acc, a) => {
                                        if (!acc[a.mitglied]) acc[a.mitglied] = { summe: 0 };
                                        acc[a.mitglied].summe += a.betrag;
                                        return acc;
                                    }, {});
                                    if (Object.keys(nachMitglied).length === 0) return '<p class="text-gray-500 text-center py-4">Keine offenen Auszahlungen</p>';
                                    return '<div class="overflow-x-auto"><table class="w-full"><thead class="bg-gray-50"><tr>' +
                                        '<th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Mitglied</th>' +
                                        '<th class="px-4 py-3 text-right text-sm font-semibold text-gray-700">Auszuzahlen</th>' +
                                        '</tr></thead><tbody class="divide-y divide-gray-200">' +
                                        Object.entries(nachMitglied).sort((a, b) => b[1].summe - a[1].summe).map(([name, d]) =>
                                            `<tr class="hover:bg-gray-50 cursor-pointer" onclick="openBelegModal('${name}')">
                                                <td class="px-4 py-3 text-sm font-medium">${name}</td>
                                                <td class="px-4 py-3 text-sm text-right font-bold text-verein-pink">${d.summe.toFixed(2)} €</td>
                                            </tr>`
                                        ).join('') + '</tbody></table></div>';
                                })()}
                            </div>
                        </div>
                        ${state.einzahlungen.length > 0 ? `
                        <div class="bg-white rounded-lg shadow overflow-hidden mb-6">
                            <div class="p-6">
                                <div class="flex items-center justify-between mb-4">
                                    <h2 class="text-xl font-bold text-gray-800">💵 Einzahlungsprotokoll</h2>
                                    <span class="text-sm text-gray-500">${state.einzahlungen.length} Einträge • Gesamt: ${state.einzahlungen.reduce((s,e) => s + e.betrag, 0).toFixed(2)} €</span>
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="w-full">
                                        <thead class="bg-gray-50"><tr>
                                            <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700">Datum</th>
                                            <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700">Mitglied</th>
                                            <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700">Zweck</th>
                                            <th class="px-4 py-2 text-right text-sm font-semibold text-gray-700">Betrag</th>
                                            <th class="px-4 py-2 text-right text-sm font-semibold text-gray-700">Erfasst am</th>
                                        </tr></thead>
                                        <tbody class="divide-y divide-gray-100">
                                            ${state.einzahlungen.map(e => `
                                                <tr class="hover:bg-gray-50">
                                                    <td class="px-4 py-2 text-sm">${e.datum}</td>
                                                    <td class="px-4 py-2 text-sm font-medium">${e.mitglied}</td>
                                                    <td class="px-4 py-2 text-sm text-gray-600">${e.zweck}</td>
                                                    <td class="px-4 py-2 text-sm text-right font-semibold text-green-600">+${parseFloat(e.betrag).toFixed(2)} €</td>
                                                    <td class="px-4 py-2 text-sm text-right text-gray-400">${new Date(e.erfasstAm).toLocaleDateString('de-DE')}</td>
                                                </tr>`).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>` : ''}
                        <div class="bg-white rounded-lg shadow overflow-hidden">
                            <div class="p-6">
                                <h2 class="text-xl font-bold text-gray-800 mb-4">Alle Auslagen</h2>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                                    <input type="text" id="filter-mitglied" placeholder="🔍 Mitglied suchen..."
                                        value="${state.filter.mitglied}"
                                        oninput="state.filter.mitglied = this.value; debounceRender();"
                                        class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-verein-pink focus:outline-none" />
                                    <select onchange="state.filter.status = this.value; debounceRender(0);"
                                        class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-verein-pink focus:outline-none">
                                        <option value="" ${state.filter.status === '' ? 'selected' : ''}>Alle Status</option>
                                        <option value="offen" ${state.filter.status === 'offen' ? 'selected' : ''}>⏳ Offen</option>
                                        <option value="bezahlt" ${state.filter.status === 'bezahlt' ? 'selected' : ''}>✅ Bezahlt</option>
                                        <option value="geloescht" ${state.filter.status === 'geloescht' ? 'selected' : ''}>🗑️ Gelöscht</option>
                                    </select>
                                    <select onchange="state.filter.kategorie = this.value; debounceRender(0);"
                                        class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-verein-pink focus:outline-none">
                                        <option value="" ${state.filter.kategorie === '' ? 'selected' : ''}>Alle Kategorien</option>
                                        ${state.kategorien.map(kat => `<option value="${kat}" ${state.filter.kategorie === kat ? 'selected' : ''}>${kat}</option>`).join('')}
                                    </select>
                                </div>
                                ${(() => {
                                    const statusOrder = { 'offen': 0, 'bezahlt': 1 };
                                    const gefiltert = state.auslagen.filter(a => {
                                        if (state.filter.mitglied !== '' && !a.mitglied.toLowerCase().includes(state.filter.mitglied.toLowerCase())) return false;
                                        if (state.filter.kategorie !== '' && a.kategorie !== state.filter.kategorie) return false;
                                        if (state.filter.status === 'geloescht') return !!a.geloescht;
                                        if (state.filter.status !== '') return !a.geloescht && a.status === state.filter.status;
                                        return true;
                                    }).sort((a, b) => {
                                        const rankA = a.geloescht ? 2 : (statusOrder[a.status] ?? 1);
                                        const rankB = b.geloescht ? 2 : (statusOrder[b.status] ?? 1);
                                        if (rankA !== rankB) return rankA - rankB;
                                        return b.id - a.id;
                                    });
                                    if (state.auslagen.length === 0) return '<p class="text-gray-500 text-center py-8">Noch keine Auslagen vorhanden</p>';
                                    if (gefiltert.length === 0) return '<p class="text-gray-500 text-center py-8">Keine Auslagen für diesen Filter gefunden</p>';
                                    return `<div class="overflow-x-auto"><table class="w-full">
                                        <thead class="bg-gray-50"><tr>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Datum</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Mitglied</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Zweck</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Kategorie</th>
                                            <th class="px-4 py-3 text-right text-sm font-semibold text-gray-700">Betrag</th>
                                            <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">Beleg</th>
                                            <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">Status</th>
                                            <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">Aktionen</th>
                                        </tr></thead>
                                        <tbody class="divide-y divide-gray-200">
                                            ${gefiltert.map(a => {
                                                if (a.geloescht) {
                                                    const wann = a.geloeschtAm ? new Date(a.geloeschtAm).toLocaleDateString('de-DE') : '–';
                                                    return `<tr class="bg-gray-50 opacity-60">
                                                        <td class="px-4 py-3 text-sm text-gray-400 line-through">${a.datum}</td>
                                                        <td class="px-4 py-3 text-sm text-gray-400 line-through">${a.mitglied}</td>
                                                        <td class="px-4 py-3 text-sm text-gray-400 line-through">${a.zweck}</td>
                                                        <td class="px-4 py-3 text-sm text-gray-400 line-through">${a.kategorie}</td>
                                                        <td class="px-4 py-3 text-sm text-right text-gray-400 line-through">${a.betrag.toFixed(2)} €</td>
                                                        <td class="px-4 py-3 text-center">${getBelege(a.beleg).length > 0 ? `<button onclick="viewBeleg(${a.id})" class="text-gray-400 text-sm">📎 ${getBelege(a.beleg).length > 1 ? getBelege(a.beleg).length : ''}</button>` : '-'}</td>
                                                        <td class="px-4 py-3 text-center">
                                                            <span class="inline-block px-3 py-1 rounded-full text-xs font-medium bg-gray-200 text-gray-500">🗑️ Gelöscht ${wann}</span>
                                                        </td>
                                                        <td class="px-4 py-3 text-center text-gray-400 text-xs">–</td>
                                                    </tr>`;
                                                }
                                                return `<tr class="hover:bg-gray-50">
                                                    <td class="px-4 py-3 text-sm">${a.datum}</td>
                                                    <td class="px-4 py-3 text-sm font-medium">${a.mitglied}</td>
                                                    <td class="px-4 py-3 text-sm">${a.zweck}</td>
                                                    <td class="px-4 py-3 text-sm text-gray-500">${a.kategorie}</td>
                                                    <td class="px-4 py-3 text-sm text-right font-semibold">${a.betrag.toFixed(2)} €</td>
                                                    <td class="px-4 py-3 text-center">${getBelege(a.beleg).length > 0 ? `<button onclick="viewBeleg(${a.id})" class="text-verein-pink hover:text-verein-pink-dark text-sm">📎 ${getBelege(a.beleg).length > 1 ? getBelege(a.beleg).length + ' Fotos' : 'Ansehen'}</button>` : '-'}</td>
                                                    <td class="px-4 py-3 text-center">
                                                        <span class="inline-block px-3 py-1 rounded-full text-xs font-medium ${a.status === 'offen' ? 'bg-verein-cyan-light text-verein-cyan' : 'bg-green-100 text-green-700'}">${a.status}</span>
                                                    </td>
                                                    <td class="px-4 py-3 text-center">
                                                        <div class="flex gap-1 justify-center flex-wrap">
                                                            ${a.status === 'offen' ? `<button onclick="updateStatus(${a.id}, 'bezahlt')" class="px-2 py-1 bg-green-500 text-white text-xs rounded hover:bg-green-600">💰 Bezahlen</button>` : ''}
                                                            <button onclick="openEditModal(${a.id})" class="px-2 py-1 bg-yellow-100 text-yellow-700 text-xs rounded hover:bg-yellow-200">✏️</button>
                                                            <button onclick="deleteAuslage(${a.id})" class="px-2 py-1 bg-red-100 text-red-600 text-xs rounded hover:bg-red-200">🗑️</button>
                                                        </div>
                                                    </td>
                                                </tr>`;
                                            }).join('')}
                                        </tbody>
                                    </table></div>`;
                                })()}
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        // --- Main Render ---
        function render() {
            const scrollPos = window.scrollY;
            const activeEl = document.activeElement;
            const activeId = activeEl ? activeEl.id : null;
            const cursorPos = activeEl && activeEl.selectionStart !== undefined ? activeEl.selectionStart : null;
            const app = document.getElementById('app');
            if (!state.currentUser) {
                app.innerHTML = renderLogin() + renderToast();
            } else if (state.view === 'neue-auslage') {
                app.innerHTML = renderNeueAuslage() + renderEditModal() + renderBelegOverlay() + renderToast();
            } else if (state.view === 'meine-auslagen') {
                app.innerHTML = renderMeineAuslagen() + renderEditModal() + renderBelegOverlay() + renderToast();
            } else if (state.view === 'dashboard') {
                app.innerHTML = renderDashboard() + renderModal() + renderReportModal() + renderKategorienModal() + renderEditModal() + renderBelegOverlay() + renderKassensturzModal() + renderAuslageModal() + renderImportModal() + renderPanelModal() + renderNutzerModal() + renderMassenModal() + renderEinzahlungModal() + renderLoading() + renderToast();
            }
            setTimeout(() => {
                window.scrollTo(0, scrollPos);
                if (activeId) {
                    const el = document.getElementById(activeId);
                    if (el) { el.focus(); if (cursorPos !== null && el.setSelectionRange) el.setSelectionRange(cursorPos, cursorPos); }
                }
            }, 0);
        }

        // --- Start ---
        loadData();
    </script>
</body>
</html>
