<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auslagen-Verwaltung - Gut und Aussehend</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .bg-verein-darkblue { background-color: #0A1929; }
        .bg-verein-pink { background-color: #E91E7E; }
        .bg-verein-cyan { background-color: #4FD9D9; }
        .text-verein-darkblue { color: #0A192F; }
        .text-verein-pink { color: #E91E7E; }
        .text-verein-cyan { color: #4FD9D9; }
        .hover\:bg-verein-pink-dark:hover { background-color: #C2185B; }
        .hover\:bg-verein-cyan-dark:hover { background-color: #26C6DA; }
        .hover\:bg-verein-darkblue-dark:hover { background-color: #061A2B; }
        .border-verein-pink { border-color: #E91E7E; }
        .border-verein-cyan { border-color: #4FD9D9; }
        .border-verein-darkblue { border-color: #0A1929; }
        .bg-verein-pink-light { background-color: #FCE4EC; }
        .bg-verein-cyan-light { background-color: #E0F7FA; }
        .bg-gradient-verein {
            background: linear-gradient(135deg, #0A1929 0%, #E91E7E 40%, #4FD9D9 100%);
        }
        .focus-verein\:ring-pink:focus { --tw-ring-color: #E91E7E; --tw-ring-offset-width: 2px; }
        .focus-verein\:ring-cyan:focus { --tw-ring-color: #4FD9D9; --tw-ring-offset-width: 2px; }
        @keyframes bounce-dot {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-8px); opacity: 1; }
        }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px; }
        .dot-1 { background: #E91E7E; animation: bounce-dot 1.2s ease-in-out infinite; }
        .dot-2 { background: #4FD9D9; animation: bounce-dot 1.2s ease-in-out 0.2s infinite; }
        .dot-3 { background: #0A1929; animation: bounce-dot 1.2s ease-in-out 0.4s infinite; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script>

        // App State
        let state = {
            currentUser: null,
            view: 'login',
            auslagen: [],
            toast: null,
            belegOverlay: null,
            belegOverlayIdx: 0,
            filter: { mitglied: '', status: '', kategorie: '' },
            editModal: { open: false, auslage: null, formData: {} },
            kategorien: [],
            kategorienModal: { open: false, neueKategorie: '' },
            reportModal: {
                open: false,
                typ: 'kategorie',
                vonDatum: new Date(new Date().getFullYear(), 0, 1).toISOString().split('T')[0],
                bisDatum: new Date().toISOString().split('T')[0],
                data: null,
                expandedRow: null
            },
            modal: { open: false, mitglied: null, belegeDesMitglieds: [], ausgewaehlt: [] },
            formData: {
                betrag: '',
                datum: new Date().toISOString().split('T')[0],
                zweck: '',
                kategorie: '',
                belege: []
            },
            kassenbestand: 5000,
            mitglieder: [],
            kassensturz: { open: false, neuerStand: '', loading: false, error: '' },
            einzahlungModal: { open: false, mitglied: '', betrag: '', datum: new Date().toISOString().split('T')[0], zweck: '', loading: false, error: '' },
            einzahlungen: [],
            panelModal: { open: false, typ: null },
            nutzerModal: { open: false, nutzer: [], neuerUsername: '', neuerName: '', error: '', loading: false },
            massenModal: { open: false, ausgewaehlt: [], betrag: '', datum: new Date().toISOString().split('T')[0], zweck: '', kategorie: '', loading: false, error: '' },
            backupMenuOpen: false,
            importModal: { open: false, rows: [], selected: [], loading: false, error: '' },
            auslageModal: { open: false, mitglied: '', betrag: '', datum: new Date().toISOString().split('T')[0], zweck: '', kategorie: '', belege: [] },
            loading: false
        };

        function formatBetrag(betrag, klasse = 'text-verein-pink') {
            const neg = betrag < 0;
            return `<span class="${neg ? 'text-red-500' : klasse} font-bold">${betrag.toFixed(2)} €</span>`;
        }

        // --- API Helpers ---
        async function api(url, options = {}) {
            const token = localStorage.getItem('authToken');
            const res = await fetch(url, {
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                },
                ...options
            });
            if (res.status === 401) {
                localStorage.removeItem('authToken');
                localStorage.removeItem('authUser');
                state.currentUser = null;
                state.view = 'login';
                render();
                throw new Error('Sitzung abgelaufen');
            }
            if (!res.ok) {
                const err = await res.json().catch(() => ({ error: 'Unbekannter Fehler' }));
                throw new Error(err.error || 'Fehler');
            }
            return res.json();
        }

        async function loadData() {
            if (!state.currentUser) {
                const token = localStorage.getItem('authToken');
                const userStr = localStorage.getItem('authUser');
                if (token && userStr) {
                    state.currentUser = JSON.parse(userStr);
                } else {
                    render();
                    return;
                }
            }
            try {
                const isKw = state.currentUser && state.currentUser.rolle === 'kassenwart';
                const requests = [
                    api('/api/auslagen'),
                    api('/api/kategorien'),
                    api('/api/kassenbestand'),
                    api('/api/mitglieder'),
                    ...(isKw ? [api('/api/einzahlungen')] : [])
                ];
                const [auslagen, kategorien, kb, mitglieder, einzahlungen] = await Promise.all(requests);
                state.auslagen = auslagen;
                state.kategorien = kategorien;
                state.kassenbestand = kb.kassenbestand;
                state.mitglieder = mitglieder;
                if (isKw) state.einzahlungen = einzahlungen || [];
                if (!state.formData.kategorie && kategorien.length > 0) {
                    state.formData.kategorie = kategorien[0];
                }
                if (state.currentUser.rolle === 'kassenwart') state.view = 'dashboard';
                else state.view = 'meine-auslagen';
            } catch (e) {
                if (e.message !== 'Sitzung abgelaufen') state.toast = 'Fehler beim Laden: ' + e.message;
            }
            render();
        }

        // --- Debounce ---
        let debounceTimer;
        function debounceRender(delay = 300) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => render(), delay);
        }

        // --- Kategorien ---
        function openKategorienModal() {
            state.kategorienModal = { open: true, neueKategorie: '' };
            render();
        }

        function closeKategorienModal() {
            state.kategorienModal = { open: false, neueKategorie: '' };
            render();
        }

        async function addKategorie() {
            const name = state.kategorienModal.neueKategorie.trim();
            if (!name) { state.toast = 'Bitte einen Namen eingeben!'; render(); return; }
            try {
                await api('/api/kategorien', { method: 'POST', body: JSON.stringify({ name }) });
                state.kategorienModal.neueKategorie = '';
                state.toast = 'Kategorie erfolgreich hinzugefügt!';
                await loadData();
            } catch (e) {
                state.toast = 'Diese Kategorie existiert bereits!';
                render();
            }
        }

        async function deleteKategorie(name) {
            const inUse = state.auslagen.some(a => a.kategorie === name);
            if (inUse) {
                state.toast = 'Kategorie wird noch von Auslagen verwendet und kann nicht gelöscht werden!';
                render();
                return;
            }
            try {
                await api('/api/kategorien/' + encodeURIComponent(name), { method: 'DELETE' });
                state.toast = 'Kategorie erfolgreich gelöscht!';
                await loadData();
            } catch (e) {
                state.toast = 'Fehler: ' + e.message;
                render();
            }
        }

        // --- Reports ---
        function openReportModal() {
            state.reportModal.open = true;
            generateReport();
        }

        function closeReportModal() {
            state.reportModal = {
                open: false,
                typ: 'kategorie',
                vonDatum: new Date(new Date().getFullYear(), 0, 1).toISOString().split('T')[0],
                bisDatum: new Date().toISOString().split('T')[0],
                data: null
            };
            render();
        }

        function generateReport() {
            const von = new Date(state.reportModal.vonDatum);
            const bis = new Date(state.reportModal.bisDatum);
            bis.setHours(23, 59, 59);
            const filtered = state.auslagen.filter(a => {
                const datum = new Date(a.datum);
                return datum >= von && datum <= bis;
            });
            let data = [];
            if (state.reportModal.typ === 'kategorie') {
                const grouped = filtered.reduce((acc, a) => {
                    if (!acc[a.kategorie]) acc[a.kategorie] = { summe: 0, anzahl: 0, auslagen: [] };
                    acc[a.kategorie].summe += a.betrag;
                    acc[a.kategorie].anzahl++;
                    acc[a.kategorie].auslagen.push(a);
                    return acc;
                }, {});
                data = Object.entries(grouped)
                    .map(([kat, w]) => ({ key: kat, kategorie: kat, anzahl: w.anzahl, summe: w.summe, auslagen: w.auslagen.sort((a, b) => new Date(b.datum) - new Date(a.datum)) }))
                    .sort((a, b) => b.summe - a.summe);
            } else if (state.reportModal.typ === 'mitglied') {
                const grouped = filtered.reduce((acc, a) => {
                    if (!acc[a.mitglied]) acc[a.mitglied] = { summe: 0, anzahl: 0, auslagen: [] };
                    acc[a.mitglied].summe += a.betrag;
                    acc[a.mitglied].anzahl++;
                    acc[a.mitglied].auslagen.push(a);
                    return acc;
                }, {});
                data = Object.entries(grouped)
                    .map(([name, w]) => ({ key: name, mitglied: name, anzahl: w.anzahl, summe: w.summe, auslagen: w.auslagen.sort((a, b) => new Date(b.datum) - new Date(a.datum)) }))
                    .sort((a, b) => b.summe - a.summe);
            } else if (state.reportModal.typ === 'monat') {
                const grouped = filtered.reduce((acc, a) => {
                    const monat = new Date(a.datum).toLocaleDateString('de-DE', { year: 'numeric', month: '2-digit' });
                    if (!acc[monat]) acc[monat] = { summe: 0, anzahl: 0, auslagen: [] };
                    acc[monat].summe += a.betrag;
                    acc[monat].anzahl++;
                    acc[monat].auslagen.push(a);
                    return acc;
                }, {});
                data = Object.entries(grouped)
                    .map(([monat, w]) => ({ key: monat, monat, anzahl: w.anzahl, summe: w.summe, auslagen: w.auslagen.sort((a, b) => new Date(b.datum) - new Date(a.datum)) }))
                    .sort((a, b) => a.monat.localeCompare(b.monat));
            } else if (state.reportModal.typ === 'status') {
                const grouped = filtered.reduce((acc, a) => {
                    if (!acc[a.status]) acc[a.status] = { summe: 0, anzahl: 0, auslagen: [] };
                    acc[a.status].summe += a.betrag;
                    acc[a.status].anzahl++;
                    acc[a.status].auslagen.push(a);
                    return acc;
                }, {});
                data = Object.entries(grouped)
                    .map(([status, w]) => ({ key: status, status, anzahl: w.anzahl, summe: w.summe, auslagen: w.auslagen.sort((a, b) => new Date(b.datum) - new Date(a.datum)) }));
            }
            state.reportModal.data = data;
            render();
        }

        function toggleReportRow(key) {
            state.reportModal.expandedRow = state.reportModal.expandedRow === key ? null : key;
            render();
        }

        function exportReport() {
            if (!state.reportModal.data || state.reportModal.data.length === 0) {
                state.toast = 'Keine Daten zum Exportieren vorhanden!';
                render();
                return;
            }
            const typ = state.reportModal.typ;
            const typNames = { kategorie: 'Kategorien', mitglied: 'Mitglieder', monat: 'Monate', status: 'Status' };
            const headers = { kategorie: 'Kategorie', mitglied: 'Mitglied', monat: 'Monat', status: 'Status' };
            let csv = [
                [headers[typ], 'Anzahl Belege', 'Summe (EUR)'].join(';'),
                ...state.reportModal.data.map(d => [d[typ], d.anzahl, d.summe.toFixed(2)].join(';'))
            ].join('\n');
            csv += `\n\nZeitraum;${state.reportModal.vonDatum};bis;${state.reportModal.bisDatum}\n`;
            csv += `Erstellt am;${new Date().toLocaleDateString('de-DE')};${new Date().toLocaleTimeString('de-DE')}`;
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Report_${typNames[typ]}_${state.reportModal.vonDatum}_bis_${state.reportModal.bisDatum}.csv`;
            link.click();
            state.toast = 'Report erfolgreich exportiert!';
            render();
        }

        // --- Login / Logout ---
        async function handleLogin() {
            const usernameRaw = document.getElementById('loginName').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';
            if (!usernameRaw) { errorEl.textContent = 'Bitte Benutzernamen eingeben.'; return; }
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameRaw, password })
                });
                const data = await res.json();
                if (!res.ok) { errorEl.textContent = data.error || 'Anmeldung fehlgeschlagen'; return; }
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('authUser', JSON.stringify({ name: data.name, rolle: data.rolle }));
                state.currentUser = { name: data.name, rolle: data.rolle };
                state.view = data.rolle === 'kassenwart' ? 'dashboard' : 'meine-auslagen';
                await loadData();
            } catch (e) {
                errorEl.textContent = 'Verbindungsfehler';
            }
        }

        function handleLoginKeypress(event) {
            if (event.key === 'Enter') handleLogin();
        }

        async function handleLogout() {
            const token = localStorage.getItem('authToken');
            if (token) await fetch('/api/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }).catch(() => {});
            localStorage.removeItem('authToken');
            localStorage.removeItem('authUser');
            state.currentUser = null;
            state.view = 'login';
            render();
        }

        // --- Beleg Helpers ---
        function getBelege(beleg) {
            if (!beleg) return [];
            if (typeof beleg === 'string' && beleg.startsWith('[')) {
                try { return JSON.parse(beleg); } catch {}
            }
            return typeof beleg === 'string' ? [beleg] : [];
        }

        function compressImage(base64, callback) {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let { width, height } = img;
                const maxWidth = 800;
                if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                canvas.width = width;
                canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.src = base64;
        }

        // --- Beleg Upload (Neue Auslage) ---
        function handleBelegUpload(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;
            let pending = files.length;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    compressImage(reader.result, (compressed) => {
                        state.formData.belege.push(compressed);
                        if (--pending === 0) render();
                    });
                };
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }

        function removeBeleg(index) {
            state.formData.belege.splice(index, 1);
            render();
        }

        // --- Auslage Submit ---
        async function handleSubmit(event) {
            event.preventDefault();
            try {
                await api('/api/auslagen', {
                    method: 'POST',
                    body: JSON.stringify({
                        mitglied: state.currentUser.name,
                        betrag: parseFloat(state.formData.betrag),
                        datum: state.formData.datum,
                        zweck: state.formData.zweck,
                        kategorie: state.formData.kategorie,
                        beleg: state.formData.belege.length > 0 ? JSON.stringify(state.formData.belege) : null
                    })
                });
                state.formData = { betrag: '', datum: new Date().toISOString().split('T')[0], zweck: '', kategorie: state.kategorien[0] || '', belege: [] };
                state.view = 'meine-auslagen';
                state.toast = 'Auslage erfolgreich eingereicht!';
                await loadData();
            } catch (e) {
                state.toast = 'Fehler: ' + e.message;
                render();
            }
        }

        // --- Status Update ---
        async function updateStatus(id, newStatus) {
            try {
                await api('/api/auslagen/' + id + '/status', {
                    method: 'PATCH',
                    body: JSON.stringify({ status: newStatus })
                });
                await loadData();
            } catch (e) {
                state.toast = 'Fehler: ' + e.message;
                render();
            }
        }

        // --- Beleg Overlay ---
        function viewBeleg(id, idx = 0) {
            const auslage = state.auslagen.find(a => a.id === id);
            if (auslage && getBelege(auslage.beleg).length > 0) {
                state.belegOverlay = auslage;
                state.belegOverlayIdx = idx;
                render();
            }
        }

        function closeBelegOverlay() {
            state.belegOverlay = null;
            render();
        }

        // --- CSV Export ---
        function exportCSV() {
            const csv = '﻿' + [
                'Datum;Mitglied;Kategorie;Zweck;Betrag (EUR);Status;Eingereicht am;Bezahlt am',
                ...state.auslagen.map(a => [
                    a.datum, a.mitglied, a.kategorie,
                    `"${(a.zweck || '').replace(/"/g, '""')}"`,
                    parseFloat(a.betrag).toFixed(2), a.status,
                    new Date(a.eingereichtAm).toLocaleDateString('de-DE'),
                    a.bezahltAm ? new Date(a.bezahltAm).toLocaleDateString('de-DE') : ''
                ].join(';'))
            ].join('\r\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'auslagen_export_' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
        }

        async function exportToGDrive() {
            state.loading = true;
            render();
            try {
                const result = await api('/api/auslagen/export-gdrive', { method: 'POST' });
                state.toast = 'Exportiert nach Google Drive: ' + result.datei;
            } catch (e) {
                state.toast = 'Fehler: ' + e.message;
            }
            state.loading = false;
            render();
        }

        // --- Kassensturz ---
        function openKassensturz() {
            state.kassensturz = { open: true, neuerStand: '', loading: false, error: '' };
            render();
        }

        function closeKassensturz() {
            state.kassensturz.open = false;
            render();
        }

        async function handleKassensturz() {
            const neuerStand = parseFloat(document.getElementById('kassensturzStand').value.replace(',', '.'));
            if (isNaN(neuerStand) || neuerStand < 0) {
                state.kassensturz.error = 'Bitte einen gültigen Betrag eingeben.';
                render();
                return;
            }
            const offene = state.auslagen.filter(a => !a.geloescht && a.status === 'offen');
            if (offene.length > 0) {
                const summe = offene.reduce((s, a) => s + a.betrag, 0).toFixed(2);
                const ok = confirm(
                    `⚠️ Achtung: Es gibt noch ${offene.length} offene Auslage(n) über ${summe} €!\n\n` +
                    `Beim Kassensturz werden ALLE Einträge unwiderruflich gelöscht – auch diese offenen Auslagen.\n\n` +
                    `Kassensturz trotzdem durchführen?`
                );
                if (!ok) return;
            }
            state.kassensturz.loading = true;
            state.kassensturz.error = '';
            render();
            try {
                const result = await api('/api/kassensturz', {
                    method: 'POST',
                    body: JSON.stringify({ neuerKassenstand: neuerStand })
                });
                state.kassensturz.open = false;
                await loadData();
                state.toast = 'Kassensturz abgeschlossen. Datei: ' + result.datei + (result.rcloneOk ? ' ✓ Google Drive' : ' (GDrive-Upload fehlgeschlagen)');
            } catch (e) {
                state.kassensturz.loading = false;
                state.kassensturz.error = 'Fehler: ' + e.message;
                render();
            }
        }

        // --- Einzahlung ---
        function openEinzahlungModal() {
            state.backupMenuOpen = false;
            state.einzahlungModal = {
                open: true, mitglied: state.mitglieder[0] || '',
                betrag: '', datum: new Date().toISOString().split('T')[0],
                zweck: '', loading: false, error: ''
            };
            render();
        }

        async function handleEinzahlung(event) {
            event.preventDefault();
            const m = state.einzahlungModal;
            const betrag = parseFloat(m.betrag);
            if (isNaN(betrag) || betrag <= 0) {
                state.einzahlungModal.error = 'Betrag muss größer als 0 sein.';
                render();
                return;
            }
            state.einzahlungModal.loading = true;
            state.einzahlungModal.error = '';
            render();
            try {
                await api('/api/einzahlungen', {
                    method: 'POST',
                    body: JSON.stringify({ mitglied: m.mitglied, betrag, datum: m.datum, zweck: m.zweck })
                });
                state.einzahlungModal.open = false;
                state.toast = `✅ Einzahlung von ${m.mitglied} (${betrag.toFixed(2)} €) erfasst.`;
                await loadData();
            } catch (e) {
                state.einzahlungModal.loading = false;
                state.einzahlungModal.error = 'Fehler: ' + e.message;
                render();
            }
        }

        function renderEinzahlungModal() {
            if (!state.einzahlungModal.open) return '';
            const m = state.einzahlungModal;
            return `
                <div class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
                        <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                            <h2 class="text-xl font-bold text-gray-800">💵 Einzahlung erfassen</h2>
                            <button onclick="state.einzahlungModal.open = false; render();" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
                        </div>
                        <form onsubmit="handleEinzahlung(event)" class="p-6 space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Mitglied *</label>
                                <select onchange="state.einzahlungModal.mitglied = this.value"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-verein-pink focus:outline-none">

        // --- Massenerfassung ---
        function openMassenModal() {
            state.massenModal = {
                open: true,
                ausgewaehlt: [...state.mitglieder],
                betrag: '',
                datum: new Date().toISOString().split('T')[0],
                zweck: '',
                kategorie: state.kategorien[0] || '',
                loading: false,
                error: ''
            };
            render();
        }

        function toggleMassenMitglied(name, cb) {
            const idx = state.massenModal.ausgewaehlt.indexOf(name);
            if (idx === -1) state.massenModal.ausgewaehlt.push(name);
            else state.massenModal.ausgewaehlt.splice(idx, 1);
            if (cb) cb.closest('label').classList.toggle('bg-verein-pink-light', idx === -1);
            updateMassenUI();
        }

        function toggleAlleMassen() {
            const selectAll = state.massenModal.ausgewaehlt.length !== state.mitglieder.length;
            state.massenModal.ausgewaehlt = selectAll ? [...state.mitglieder] : [];
            document.querySelectorAll('.massen-cb').forEach(cb => {
                cb.checked = selectAll;
                cb.closest('label').classList.toggle('bg-verein-pink-light', selectAll);
            });
            updateMassenUI();
        }

        function negWarn(input, id) {
            const el = document.getElementById(id);
            if (el) el.style.display = parseFloat(input.value) < 0 ? 'flex' : 'none';
        }

        function updateMassenUI() {
            const count = state.massenModal.ausgewaehlt.length;
            const total = state.mitglieder.length;
            const countEl = document.getElementById('massen-count');
            const btnEl = document.getElementById('massen-submit-btn');
            const toggleEl = document.getElementById('massen-toggle-btn');
            if (countEl) countEl.textContent = `${count} von ${total} Mitgliedern ausgewählt`;
            if (btnEl) btnEl.textContent = `Für ${count} Mitglieder erfassen`;
            if (toggleEl) toggleEl.textContent = count === total ? 'Auswahl aufheben' : 'Alle auswählen';
        }

        async function handleMassenerfassung(event) {
            event.preventDefault();
            const m = state.massenModal;
            if (!m.ausgewaehlt.length) { state.massenModal.error = 'Bitte mindestens ein Mitglied auswählen.'; render(); return; }
            if (m.betrag === '' || isNaN(parseFloat(m.betrag))) { state.massenModal.error = 'Bitte einen gültigen Betrag eingeben.'; render(); return; }
            state.massenModal.loading = true;
            state.massenModal.error = '';
            render();
            try {
                const result = await api('/api/auslagen/massen', {
                    method: 'POST',
                    body: JSON.stringify({
                        mitglieder: m.ausgewaehlt,
                        betrag: parseFloat(m.betrag),
                        datum: m.datum,
                        zweck: m.zweck,
                        kategorie: m.kategorie
                    })
                });
                state.massenModal.open = false;
                state.toast = `${result.inserted} Auslagen erfolgreich erfasst.`;
                await loadData();
            } catch (e) {
                state.massenModal.loading = false;
                state.massenModal.error = e.message;
                render();
            }
        }

                render();

                offen:   { titel: 'Offene Auslagen',   farbe: 'text-verein-cyan',  liste: state.auslagen.filter(a => !a.geloescht && a.status === 'offen') },
                bezahlt: { titel: 'Bezahlte Auslagen', farbe: 'text-green-500',    liste: state.auslagen.filter(a => !a.geloescht && a.status === 'bezahlt') },
                gesamt:  { titel: 'Alle Auslagen',     farbe: 'text-verein-pink',  liste: state.auslagen.filter(a => !a.geloescht) }
            }[typ];
            const summe = config.liste.reduce((s, a) => s + a.betrag, 0);
            const nachMitglied = config.liste.reduce((acc, a) => {
                if (!acc[a.mitglied]) acc[a.mitglied] = { summe: 0, anzahl: 0 };

                acc[a.mitglied].anzahl++;

            return `
                <div class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col">

                                <div class="flex items-center justify-between py-3 border-b border-gray-100 last:border-0">

        async function handleAuslageModalSubmit(event) {
            event.preventDefault();
            const m = state.auslageModal;
            if (!m.mitglied || !m.betrag || !m.datum || !m.zweck || !m.kategorie) return;
            try {
                await api('/api/auslagen', {
                    method: 'POST',
                    body: JSON.stringify({
                        mitglied: m.mitglied,
                        betrag: parseFloat(m.betrag),
                        datum: m.datum,
                        zweck: m.zweck,
                        kategorie: m.kategorie,
                        beleg: m.belege.length > 0 ? JSON.stringify(m.belege) : null
                    })
                });
                state.auslageModal.open = false;
                state.toast = `Auslage für ${m.mitglied} erfasst.`;
                await loadData();
            } catch (e) {
                state.toast = 'Fehler: ' + e.message;
                render();
            }
        }

        function handleAuslageModalBeleg(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;
            let pending = files.length;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const max = 1200;
                        let w = img.width, h = img.height;
                        if (w > max || h > max) { if (w > h) { h = Math.round(h * max / w); w = max; } else { w = Math.round(w * max / h); h = max; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        state.auslageModal.belege.push(canvas.toDataURL('image/jpeg', 0.7));
                        if (--pending === 0) render();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }

        function removeAuslageBeleg(index) {
            state.auslageModal.belege.splice(index, 1);
            render();
        }

                                <label class="block text-sm font-medium text-gray-700 mb-1">Mitglied *</label>
                                <select onchange="state.auslageModal.mitglied = this.value"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-verein-pink focus:outline-none">
                                    ${mitglieder.map(name => `<option ${m.mitglied === name ? 'selected' : ''}>${name}</option>`).join('')}

                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-verein-pink focus:outline-none"
                                    placeholder="z.B. 12.50" />
                                <div id="neg-warn-auslage" style="display:${parseFloat(m.betrag) < 0 ? 'flex' : 'none'}" class="mt-1 items-center gap-1 text-amber-600 text-sm font-medium">
                                    ⚠️ Negativer Betrag erkannt – bist du wirklich sicher?
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Datum *</label>
                                <input type="date" required value="${m.datum}"
                                    oninput="state.auslageModal.datum = this.value"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-verein-pink focus:outline-none" />
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Kategorie</label>
                                <select onchange="state.auslageModal.kategorie = this.value"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-verein-pink focus:outline-none">
                                    ${state.kategorien.map(kat => `<option ${m.kategorie === kat ? 'selected' : ''}>${kat}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Zweck / Beschreibung *</label>
                                <textarea required oninput="state.auslageModal.zweck = this.value"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-verein-pink focus:outline-none"
                                    rows="3" placeholder="z.B. Stoffe für Kostüme…">${m.zweck}</textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Beleg (optional)</label>
                                <div class="border-2 border-dashed border-gray-300 rounded-lg p-4">
                                    ${m.belege.length > 0 ? `
                                        <div class="grid grid-cols-3 gap-2 mb-3">
                                            ${m.belege.map((b, i) => `
                                                <div class="relative">
                                                    <img src="${b}" class="w-full h-24 object-cover rounded" />
                                                    <button type="button" onclick="removeAuslageBeleg(${i})"
                                                        class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-5 h-5 text-xs leading-5 text-center hover:bg-red-600">✕</button>
                                                </div>`).join('')}
                                        </div>` : ''}
                                    <div class="text-center">
                                        <input type="file" accept="image/*" multiple onchange="handleAuslageModalBeleg(event)" class="hidden" id="auslage-modal-beleg" />
                                        <label for="auslage-modal-beleg" class="cursor-pointer text-verein-pink hover:bg-verein-pink-light px-3 py-1 rounded font-medium transition inline-block">
                                            📸 ${m.belege.length > 0 ? 'Weitere Fotos' : 'Fotos auswählen'}
                                        </label>
                                        <p class="text-xs text-gray-400 mt-1">JPG, PNG, max 10MB</p>
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-3 pt-2">
                                <button type="button" onclick="state.auslageModal.open = false; render();"
                                    class="flex-1 py-3 rounded-lg border-2 border-gray-300 text-gray-700 font-semibold hover:bg-gray-50">
                                    Abbrechen
                                </button>
                                <button type="submit"
                                    class="flex-1 py-3 rounded-lg bg-verein-pink text-white font-semibold hover:bg-verein-pink-dark transition">
                                    Auslage erfassen
                                </button>
                            </div>
                        </form>
                    </div>
                </div>`;
        }

        // --- Import ---
        function handleImportFile(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result.replace(/^﻿/, '').replace(/\r/g, '');
                const lines = text.split('\n').filter(l => l.trim());
                if (lines.length < 2) {
                    state.importModal = { open: true, rows: [], selected: [], loading: false, error: 'Datei enthält keine Daten.' };
                    render();
                    return;
                }
                const rows = lines.slice(1).map((line, i) => {
                    const cols = line.split(';').map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
                    return {
                        _id: i,
                        datum: cols[0] || '',
                        mitglied: cols[1] || '',
                        kategorie: cols[2] || '',
                        zweck: cols[3] || '',
                        betrag: parseFloat((cols[4] || '0').replace(',', '.')),
                        status: cols[5] || 'offen'
                    };
                }).filter(r => r.mitglied && r.betrag > 0);
                state.importModal = { open: true, rows, selected: rows.map(r => r._id), loading: false, error: '' };
                render();
            };
            reader.readAsText(file, 'UTF-8');
        }

        function toggleImportRow(id) {
            const idx = state.importModal.selected.indexOf(id);
            if (idx === -1) state.importModal.selected.push(id);
            else state.importModal.selected.splice(idx, 1);
            render();
        }

        function toggleAllImport() {
            if (state.importModal.selected.length === state.importModal.rows.length) {
                state.importModal.selected = [];
            } else {
                state.importModal.selected = state.importModal.rows.map(r => r._id);
            }
            render();
        }

        async function handleImport() {
            const toImport = state.importModal.rows.filter(r => state.importModal.selected.includes(r._id));
            if (toImport.length === 0) { state.importModal.error = 'Keine Einträge ausgewählt.'; render(); return; }
            state.importModal.loading = true;
            state.importModal.error = '';
            render();
            try {
                const result = await api('/api/auslagen/bulk', {
                    method: 'POST',
                    body: JSON.stringify({ auslagen: toImport })
                });
                state.importModal.open = false;
                state.toast = `${result.inserted} Auslagen erfolgreich importiert.`;
                await loadData();
            } catch (e) {
                state.importModal.loading = false;
                state.importModal.error = 'Fehler: ' + e.message;
                render();
            }
        }

        function renderImportModal() {
            if (!state.importModal.open) return '';
            const { rows, selected, loading, error } = state.importModal;
            const allSelected = selected.length === rows.length && rows.length > 0;
            return `
                <div class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl flex flex-col max-h-[90vh]">
                        <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                            <h2 class="text-xl font-bold text-gray-800">📂 CSV importieren</h2>
                            <button onclick="state.importModal.open = false; render();" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
                        </div>
                        ${rows.length === 0 ? `
                            <div class="p-8 text-center text-gray-500">${error || 'Keine gültigen Daten gefunden.'}</div>
                        ` : `
                            <div class="p-4 border-b border-gray-100 flex items-center justify-between gap-3 flex-wrap">
                                <span class="text-sm text-gray-600">${rows.length} Einträge gefunden · <strong>${selected.length}</strong> ausgewählt</span>
                                <button onclick="toggleAllImport()" class="text-sm px-3 py-1 rounded border border-gray-300 hover:bg-gray-50">
                                    ${allSelected ? 'Auswahl aufheben' : 'Alle auswählen'}
                                </button>
                            </div>
                            <div class="overflow-auto flex-1">
                                <table class="w-full text-sm">
                                    <thead class="bg-gray-50 sticky top-0">
                                        <tr>
                                            <th class="px-4 py-3 text-left w-8"></th>
                                            <th class="px-4 py-3 text-left">Datum</th>
                                            <th class="px-4 py-3 text-left">Mitglied</th>
                                            <th class="px-4 py-3 text-left">Kategorie</th>
                                            <th class="px-4 py-3 text-left">Zweck</th>
                                            <th class="px-4 py-3 text-right">Betrag</th>
                                            <th class="px-4 py-3 text-center">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                                        ${rows.map(r => `
                                            <tr class="hover:bg-gray-50 cursor-pointer ${selected.includes(r._id) ? '' : 'opacity-40'}" onclick="toggleImportRow(${r._id})">
                                                <td class="px-4 py-3">
                                                    <input type="checkbox" ${selected.includes(r._id) ? 'checked' : ''} onclick="event.stopPropagation(); toggleImportRow(${r._id})" class="accent-verein-pink" />
                                                </td>
                                                <td class="px-4 py-3">${r.datum}</td>
                                                <td class="px-4 py-3 font-medium">${r.mitglied}</td>
                                                <td class="px-4 py-3">${r.kategorie}</td>
                                                <td class="px-4 py-3 max-w-xs truncate">${r.zweck}</td>
                                                <td class="px-4 py-3 text-right font-mono">${r.betrag.toFixed(2)} €</td>
                                                <td class="px-4 py-3 text-center">
                                                    <span class="px-2 py-0.5 rounded-full text-xs ${r.status === 'offen' ? 'bg-verein-cyan-light text-verein-cyan' : 'bg-green-100 text-green-700'}">${r.status}</span>
                                                </td>
                                            </tr>`).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                        ${error ? `<p class="px-6 py-2 text-red-600 text-sm">${error}</p>` : ''}
                        <div class="p-6 border-t border-gray-200 flex gap-3 justify-end">
                            <button onclick="state.importModal.open = false; render();"
                                class="px-5 py-2 rounded-lg border-2 border-gray-300 text-gray-700 hover:bg-gray-50 font-semibold">
                                Abbrechen
                            </button>
                            <button onclick="handleImport()" ${loading || selected.length === 0 ? 'disabled' : ''}
                                class="px-5 py-2 rounded-lg bg-indigo-500 text-white hover:bg-indigo-600 font-semibold disabled:opacity-50">
                                ${loading ? 'Importiere…' : `${selected.length} Einträge importieren`}
                            </button>
                        </div>
                    </div>
                </div>`;
        }

        function renderKassensturzModal() {
            if (!state.kassensturz.open) return '';
            const summeOffen = state.auslagen.filter(a => !a.geloescht && a.status === 'offen').reduce((s, a) => s + a.betrag, 0);
            return `
                <div class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">Kassensturz durchführen</h2>
                        <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-4 text-sm text-red-800">
                            <strong>Achtung:</strong> Diese Aktion exportiert alle aktuellen Auslagen (${state.auslagen.length} Einträge)
                            nach Google Drive und löscht sie anschließend unwiderruflich.
                        </div>
                        <div class="bg-gray-50 rounded-lg p-4 mb-4 text-sm space-y-1">
                            <div class="flex justify-between"><span class="text-gray-600">Auslagen gesamt:</span><span class="font-medium">${state.auslagen.length} Einträge</span></div>
                            <div class="flex justify-between"><span class="text-gray-600">Davon offen:</span><span class="font-medium text-verein-pink">${summeOffen.toFixed(2)} €</span></div>
                            <div class="flex justify-between"><span class="text-gray-600">Aktueller Kassenbestand:</span><span class="font-medium">${state.kassenbestand.toFixed(2)} €</span></div>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Neuer Kassenbestand (€)</label>
                            <input type="number" id="kassensturzStand" min="0" step="0.01" placeholder="z.B. 5000.00"
                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-verein-pink focus:outline-none text-lg font-mono" />
                        </div>
                        ${state.kassensturz.error ? `<p class="text-red-600 text-sm mb-3">${state.kassensturz.error}</p>` : ''}
                        <div class="flex gap-3">
                            <button onclick="closeKassensturz()"
                                class="flex-1 py-3 rounded-lg border-2 border-gray-300 text-gray-700 font-semibold hover:bg-gray-50 transition">
                                Abbrechen
                            </button>
                            <button onclick="handleKassensturz()" ${state.kassensturz.loading ? 'disabled' : ''}
                                class="flex-1 py-3 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700 transition disabled:opacity-50">
                                ${state.kassensturz.loading ? 'Wird ausgeführt…' : 'Kassensturz starten'}
                            </button>
                        </div>
                    </div>
                </div>`;
        }

        // --- Auszahlungs-Modal ---
        function openBelegModal(mitglied) {
            const belegeDesMitglieds = state.auslagen.filter(a => !a.geloescht && a.mitglied === mitglied && a.status === 'offen');
            state.modal = { open: true, mitglied, belegeDesMitglieds, ausgewaehlt: [] };
            render();
        }

        function toggleBeleg(id) {
            const idx = state.modal.ausgewaehlt.indexOf(id);
            if (idx === -1) state.modal.ausgewaehlt.push(id);
            else state.modal.ausgewaehlt.splice(idx, 1);
            render();
        }

        async function bezahleAusgewaehlt() {
            if (state.modal.ausgewaehlt.length === 0) { alert('Bitte mindestens einen Beleg auswählen!'); return; }
            try {
                await Promise.all(state.modal.ausgewaehlt.map(id =>
                    api('/api/auslagen/' + id + '/status', { method: 'PATCH', body: JSON.stringify({ status: 'bezahlt' }) })
                ));
                state.modal = { open: false, mitglied: null, belegeDesMitglieds: [], ausgewaehlt: [] };
                await loadData();
            } catch (e) {
                state.toast = 'Fehler: ' + e.message;
                render();
            }
        }

        function closeModal() {
            state.modal = { open: false, mitglied: null, belegeDesMitglieds: [], ausgewaehlt: [] };
            render();
        }

        // --- Löschen ---
        async function deleteAuslage(id) {
            const auslage = state.auslagen.find(a => a.id === id);
            if (!auslage) return;
            if (state.currentUser.rolle === 'mitglied' && auslage.status !== 'offen') {
                state.toast = 'Nur offene Auslagen können gelöscht werden!';
                render();
                return;
            }
            const bestaetigt = confirm(`Auslage wirklich löschen?\n\n${auslage.mitglied} – ${auslage.zweck} (${auslage.betrag.toFixed(2)} €)\n\nDie Auslage bleibt für den Kassenwart zur Nachvollziehbarkeit einsehbar.`);
            if (!bestaetigt) return;
            try {
                await api('/api/auslagen/' + id, { method: 'DELETE' });
                state.toast = 'Auslage gelöscht (bleibt für Kassenwart sichtbar)';
                await loadData();
            } catch (e) {
                state.toast = 'Fehler: ' + e.message;
                render();
            }
        }

        // --- Bearbeiten Modal ---
        function openEditModal(id) {
            const auslage = state.auslagen.find(a => a.id === id);
            if (!auslage) return;
            if (state.currentUser.rolle === 'mitglied') {
                if (auslage.mitglied !== state.currentUser.name || auslage.status !== 'offen') {
                    state.toast = 'Nur eigene offene Auslagen können bearbeitet werden!';
                    render();
                    return;
                }
            }
            state.editModal = {
                open: true,
                auslage,
                formData: { betrag: auslage.betrag, datum: auslage.datum, zweck: auslage.zweck, kategorie: auslage.kategorie }
            };
            render();
        }

        function closeEditModal() {
            state.editModal = { open: false, auslage: null, formData: {} };
            render();
        }

        async function saveEdit() {
            const auslage = state.auslagen.find(a => a.id === state.editModal.auslage.id);
            if (!auslage) return;
            const aenderungen = [];
            const neu = state.editModal.formData;
            if (parseFloat(neu.betrag) !== auslage.betrag)
                aenderungen.push({ feld: 'Betrag', alt: auslage.betrag.toFixed(2) + ' €', neu: parseFloat(neu.betrag).toFixed(2) + ' €' });
            if (neu.datum !== auslage.datum)
                aenderungen.push({ feld: 'Datum', alt: auslage.datum, neu: neu.datum });
            if (neu.zweck !== auslage.zweck)
                aenderungen.push({ feld: 'Zweck', alt: auslage.zweck, neu: neu.zweck });
            if (neu.kategorie !== auslage.kategorie)
                aenderungen.push({ feld: 'Kategorie', alt: auslage.kategorie, neu: neu.kategorie });

            if (aenderungen.length > 0) {
                const historie = Array.isArray(auslage.historie) ? [...auslage.historie] : [];
                historie.push({ zeitpunkt: new Date().toISOString(), aktion: 'Bearbeitet', benutzer: state.currentUser.name, aenderungen });
                try {
                    await api('/api/auslagen/' + auslage.id, {
                        method: 'PUT',
                        body: JSON.stringify({ betrag: parseFloat(neu.betrag), datum: neu.datum, zweck: neu.zweck, kategorie: neu.kategorie, historie })
                    });
                    state.toast = 'Änderungen erfolgreich gespeichert!';
                } catch (e) {
                    state.toast = 'Fehler: ' + e.message;
                }
            } else {
                state.toast = 'Keine Änderungen vorgenommen.';
            }
            closeEditModal();
            await loadData();
        }

        // --- Render: Beleg Overlay ---
        function renderBelegOverlay() {
            if (!state.belegOverlay) return '';
            const a = state.belegOverlay;
            const bilder = getBelege(a.beleg);
            const idx = Math.max(0, Math.min(state.belegOverlayIdx, bilder.length - 1));
            return `
                <div class="fixed inset-0 bg-black bg-opacity-50 z-50" onclick="closeBelegOverlay()"></div>
                <div class="fixed top-0 right-0 h-full w-full max-w-lg bg-white z-50 shadow-2xl flex flex-col">
                    <div class="bg-verein-darkblue text-white p-5 flex justify-between items-center flex-shrink-0">
                        <div>
                            <p class="text-xs text-cyan-300 mb-1">Beleg von</p>
                            <h2 class="text-lg font-bold">${a.mitglied}</h2>
                        </div>
                        <button onclick="closeBelegOverlay()" class="bg-white bg-opacity-20 hover:bg-opacity-30 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl font-bold transition">✕</button>
                    </div>
                    <div class="p-5 border-b border-gray-100 flex-shrink-0">
                        <h3 class="font-semibold text-gray-800 text-lg mb-1">${a.zweck}</h3>
                        <div class="flex flex-wrap gap-3 mt-2">
                            <span class="text-2xl font-bold text-verein-pink">${a.betrag.toFixed(2)} €</span>
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium ${a.status === 'offen' ? 'bg-verein-cyan-light text-verein-cyan' : 'bg-green-100 text-green-700'}">
                                ${a.status === 'offen' ? '⏳ Offen' : '✅ Bezahlt'}
                            </span>
                        </div>
                        <div class="flex gap-4 mt-3 text-sm text-gray-500">
                            <span>📅 ${a.datum}</span>
                            <span>🏷️ ${a.kategorie}</span>
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto p-5">
                        <div class="flex items-center justify-between mb-3">
                            <p class="text-xs text-gray-400 uppercase font-semibold">Foto ${idx + 1} von ${bilder.length}</p>
                            ${bilder.length > 1 ? `
                                <div class="flex gap-2">
                                    <button onclick="state.belegOverlayIdx = Math.max(0, ${idx} - 1); render();" ${idx === 0 ? 'disabled' : ''}
                                        class="px-3 py-1 rounded bg-gray-100 hover:bg-gray-200 text-sm disabled:opacity-30">← Zurück</button>
                                    <button onclick="state.belegOverlayIdx = Math.min(${bilder.length - 1}, ${idx} + 1); render();" ${idx === bilder.length - 1 ? 'disabled' : ''}
                                        class="px-3 py-1 rounded bg-gray-100 hover:bg-gray-200 text-sm disabled:opacity-30">Weiter →</button>
                                </div>` : ''}
                        </div>
                        <img src="${bilder[idx]}" alt="Beleg" class="w-full object-contain rounded-xl border border-gray-200" />
                        ${bilder.length > 1 ? `
                            <div class="flex gap-2 mt-3 overflow-x-auto pb-1">
                                ${bilder.map((b, i) => `<img src="${b}" onclick="state.belegOverlayIdx = ${i}; render();"
                                    class="h-14 w-14 object-cover rounded cursor-pointer flex-shrink-0 border-2 ${i === idx ? 'border-verein-pink' : 'border-transparent hover:border-gray-300'}" />`).join('')}
                            </div>` : ''}
                    </div>
                    <div class="p-5 border-t border-gray-100 flex-shrink-0">
                        <div class="flex gap-3">
                            ${a.status === 'offen' ? `<button onclick="updateStatus(${a.id}, 'bezahlt'); closeBelegOverlay();" class="flex-1 py-3 rounded-lg bg-green-500 hover:bg-green-600 text-white font-semibold transition">💰 Bezahlen</button>` : ''}
                            <button onclick="openEditModal(${a.id}); closeBelegOverlay();" class="flex-1 py-3 rounded-lg bg-yellow-100 hover:bg-yellow-200 text-yellow-700 font-semibold transition">✏️ Bearbeiten</button>
                            <button onclick="closeBelegOverlay()" class="flex-1 py-3 rounded-lg border-2 border-gray-300 text-gray-600 font-semibold hover:bg-gray-50 transition">Schließen</button>
                        </div>
                    </div>
                </div>`;
        }

        // --- Render: Edit Modal ---
        function renderEditModal() {
            if (!state.editModal.open) return '';
            const a = state.editModal.auslage;
            return `
                <div class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4" onclick="closeEditModal()">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-screen overflow-y-auto" onclick="event.stopPropagation()">
                        <div class="bg-verein-darkblue text-white p-6 rounded-t-2xl flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-bold">Auslage bearbeiten</h2>
                                <p class="text-cyan-200 text-sm mt-1">${a.mitglied} • ${a.status}</p>
                            </div>
                            <button onclick="closeEditModal()" class="text-white hover:text-cyan-200 text-2xl font-bold">✕</button>
                        </div>
                        <div class="p-6 space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Betrag (€) *</label>
                                <input type="number" step="0.01" required value="${state.editModal.formData.betrag}"
                                    oninput="state.editModal.formData.betrag = this.value; negWarn(this, 'neg-warn-edit')"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-verein-pink focus:outline-none" />
                                <div id="neg-warn-edit" style="display:${parseFloat(state.editModal.formData.betrag) < 0 ? 'flex' : 'none'}" class="mt-1 items-center gap-1 text-amber-600 text-sm font-medium">
                                    ⚠️ Negativer Betrag erkannt – bist du wirklich sicher?
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Datum *</label>
                                <input type="date" required value="${state.editModal.formData.datum}"
                                    oninput="state.editModal.formData.datum = this.value"

        // --- Render: Report Modal ---
        function renderReportModal() {
            if (!state.reportModal.open) return '';
            const gesamtSumme = state.reportModal.data ? state.reportModal.data.reduce((s, d) => s + d.summe, 0) : 0;

            return `
                <div class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4" onclick="closeReportModal()">

                        <div class="bg-verein-darkblue text-white p-6 rounded-t-2xl flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-bold">📊 Auswertung erstellen</h2>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Report-Typ</label>
                                    <select onchange="state.reportModal.typ = this.value; generateReport();"

                                        <option value="mitglied" ${state.reportModal.typ === 'mitglied' ? 'selected' : ''}>Nach Mitglied</option>
                                        <option value="monat" ${state.reportModal.typ === 'monat' ? 'selected' : ''}>Nach Monat</option>
                                        <option value="status" ${state.reportModal.typ === 'status' ? 'selected' : ''}>Nach Status</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Von Datum</label>
                                    <input type="date" value="${state.reportModal.vonDatum}"
                                        onchange="state.reportModal.vonDatum = this.value; generateReport();"
                                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-verein-pink focus:outline-none" />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Bis Datum</label>
                                    <input type="date" value="${state.reportModal.bisDatum}"

                                </div>
                            </div>
                            ${state.reportModal.data && state.reportModal.data.length > 0 ? `
                                <div class="border-t pt-4">
                                    <div class="flex justify-between items-center mb-4">
                                        <h3 class="text-lg font-bold text-gray-800">Vorschau</h3>
                                        <div class="text-right">
                                            <p class="text-sm text-gray-500">Gesamt</p>
                                            <p class="text-xl font-bold text-verein-pink">${gesamtSumme.toFixed(2)} €</p>
                                            <p class="text-xs text-gray-400">${gesamtAnzahl} Belege</p>
                                        </div>
                                    </div>
                                    <div class="overflow-x-auto">
                                        <table class="w-full">
                                            <thead class="bg-gray-50">
                                                <tr>
                                                    <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700 w-8"></th>
                                                    ${state.reportModal.typ === 'kategorie' ? '<th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Kategorie</th>' : ''}
                                                    ${state.reportModal.typ === 'mitglied' ? '<th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Mitglied</th>' : ''}
                                                    ${state.reportModal.typ === 'monat' ? '<th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Monat</th>' : ''}
                                                    ${state.reportModal.typ === 'status' ? '<th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Status</th>' : ''}

                                                    <th class="px-4 py-3 text-right text-sm font-semibold text-gray-700">Summe</th>
                                                    <th class="px-4 py-3 text-right text-sm font-semibold text-gray-700">Anteil</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-gray-200">
                                                ${state.reportModal.data.map(d => {

                                                    const isExp = state.reportModal.expandedRow === d.key;
                                                    return `
                                                        <tr class="hover:bg-gray-50 cursor-pointer" onclick="toggleReportRow('${d.key.replace(/'/g, "\\'")}')">
                                                            <td class="px-4 py-3 text-sm text-center"><span class="text-gray-400">${isExp ? '▼' : '▶'}</span></td>
                                                            ${state.reportModal.typ === 'kategorie' ? `<td class="px-4 py-3 text-sm font-medium">${d.kategorie}</td>` : ''}
                                                            ${state.reportModal.typ === 'mitglied' ? `<td class="px-4 py-3 text-sm font-medium">${d.mitglied}</td>` : ''}
                                                            ${state.reportModal.typ === 'monat' ? `<td class="px-4 py-3 text-sm font-medium">${d.monat}</td>` : ''}
                                                            ${state.reportModal.typ === 'status' ? `<td class="px-4 py-3 text-sm font-medium">${d.status}</td>` : ''}
                                                            <td class="px-4 py-3 text-sm text-right">${d.anzahl}</td>
                                                            <td class="px-4 py-3 text-sm text-right font-semibold">${d.summe.toFixed(2)} €</td>
                                                            <td class="px-4 py-3 text-sm text-right">
